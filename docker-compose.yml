services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      KAFKA_HEAP_OPTS: "-Xmx3G -Xms3G"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-raw --partitions 12 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-clean --partitions 12 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-alerts --partitions 4 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-current --partitions 12 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-stats --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-spikes --partitions 4 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-heatmap --partitions 4 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-config --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic radiation-top --partitions 1 --replication-factor 1 &&
      kafka-console-producer --bootstrap-server kafka:29092 --topic radiation-config <<< '{"threshold": 100.0}' &&
      echo 'All topics created.'"

  producer:
    build: ./producer
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro

  flink-jobmanager:
    build: ./flink-job
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
      KAFKA_BOOTSTRAP: kafka:29092
      ALERT_THRESHOLD: "100"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully

  flink-taskmanager:
    build: ./flink-job
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
  flink-submitter:
    build: ./flink-job
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        until bash -c 'echo > /dev/tcp/flink-jobmanager/8081' 2>/dev/null; do echo "waiting for jobmanager..."; sleep 3; done
        sleep 30
        flink run -m flink-jobmanager:8081 -pyclientexec python3 -pyexec python3 -pyfs /opt/flink/usrlib/config.py -py /opt/flink/usrlib/flink_job.py
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  backend:
    build: ./radiation-backend
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      BACKEND_MOCK_MODE: "false"
      BACKEND_KAFKA_BOOTSTRAP: "kafka:29092"
      BACKEND_REDIS_URL: "redis://redis:6379/0"
      BACKEND_MAX_ALERTS: "200"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
  frontend:
      build: ./frontend
      container_name: frontend
      ports:
        - "5173:5173"
      depends_on:
        - backend
      restart: unless-stopped
